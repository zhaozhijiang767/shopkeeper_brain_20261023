version: '3.5' # 指定 Docker Compose 文件的语法版本为 3.5

services: # 定义需要运行的各个服务（容器）集合
  etcd: # 定义 etcd 服务。Milvus 强依赖它来存储集群的元数据（如 Collection 结构、节点状态等）
    container_name: milvus-etcd # 固定容器名称，方便后期通过 docker 命令直接管理
    image: quay.io/coreos/etcd:v3.5.25 # 指定使用的 etcd 官方镜像及具体版本号 v3.5.25
    environment: # 配置容器运行时的核心环境变量
      - ETCD_AUTO_COMPACTION_MODE=revision # 开启自动压缩，模式为基于版本号（revision）压缩
      - ETCD_AUTO_COMPACTION_RETENTION=1000 # 保留最近的 1000 个版本，更早的历史变更将被清理，防止内存撑爆
      - ETCD_QUOTA_BACKEND_BYTES=4294967296 # 设置数据库后端存储配额上限为 4GB (4294967296 字节)
      - ETCD_SNAPSHOT_COUNT=50000 # 每当发生 50000 次事务变更时，触发一次持久化快照打盘
    volumes: # 配置目录映射，实现数据持久化（即便容器被删，数据依然在宿主机上）
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd # 将宿主机目录挂载到容器内的 /etcd 目录
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd # 覆盖默认启动命令，设置监听所有网卡 (0.0.0.0) 的 2379 端口，并指定数据存放目录
    healthcheck: # 容器健康检查机制，决定了依赖它的服务何时能启动
      test: ["CMD", "etcdctl", "endpoint", "health"] # 使用 etcd 自带的命令行工具测试端点存活状态
      interval: 30s # 检查频率：每 30 秒执行一次
      timeout: 20s # 超时时间：每次检查最多等待 20 秒
      retries: 3 # 容错次数：连续失败 3 次则将容器状态标记为 unhealthy
    restart: always  # 重启策略：无论容器因何种原因退出（如宿主机重启），Docker 都会自动将其拉起

  rustfs: # 定义 RustFS 服务（S3 兼容对象存储）。Milvus 依赖此对象存储来保存持久化的向量切片和标量日志文件
    container_name: milvus-rustfs # 固定容器名称为 milvus-rustfs
    image: rustfs/rustfs:latest # 指定 RustFS 官方镜像：对外提供标准 S3 API，Milvus 及各类 S3 SDK 可直接对接
    environment: # 根凭据，必须与 .env 中的 RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY 一致
      # （这里写死 rustfs/rustfs，改这里务必同步改 .env，否则客户端会报 403 InvalidAccessKeyId）
      RUSTFS_ACCESS_KEY: rustfs # Root Access Key
      RUSTFS_SECRET_KEY: rustfs # Root Secret Key
    ports: # 配置端口映射，格式为 "宿主机端口:容器内端口"
      - "9001:9001" # 映射控制台端口：RustFS 内置 Web 控制台默认监听 :9001，无需再传 --console-address 参数
      - "9000:9000" # 映射 API 端口：S3 API 默认监听 :9000，Milvus 读写数据都是通过这根管道进行的
    volumes: # 数据卷持久化挂载
      # 【重要】RustFS 官方镜像以非 root 用户 rustfs (UID 10001) 运行，Linux 部署启动前须执行：
      # chown -R 10001:10001 ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rustfs
      # 否则会 Permission denied。另注：volumes 下的旧目录是上一代对象存储的私有格式，不要复用，
      # 存量数据需用 mc mirror 复制到新目录或重建
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/rustfs:/data # 将宿主机目录映射给 RustFS 存放实际的 Bucket 对象文件（镜像内置默认数据目录即 /data）
    healthcheck: # RustFS 的健康检查配置
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"] # 请求其原生 /health 存活探针（官方镜像基于 Alpine 自带 curl）
      interval: 30s # 每 30 秒检查一次
      timeout: 20s # 每次检查超时 20 秒
      retries: 3 # 允许失败 3 次
    restart: always # 总是自动重启

  standalone: # 定义 Milvus 向量数据库核心服务（单机版模式）
    container_name: milvus-standalone # 固定容器名称
    image: milvusdb/milvus:v2.5.5 # 指定 Milvus V2.5.5 官方镜像
    command: ["milvus", "run", "standalone"] # 以 standalone（将读写节点、查询节点等全打包在单一进程内）模式启动
    security_opt: # Docker 容器安全选项
    - seccomp:unconfined # 解除系统的 seccomp 系统调用过滤限制。Milvus 底层某些针对 CPU 向量指令集（如 AVX-512）的极致优化操作需要这一权限
    environment: # 核心环境变量（对象存储配置已移至 configs/milvus.yaml）
      ETCD_ENDPOINTS: etcd:2379 # 告诉 Milvus 如何连接 etcd 服务（Docker 内部 DNS 名称 "etcd"）
      MQ_TYPE: rocksmq # 使用轻量级本地 RocksMQ（单机版标配，无需部署 Pulsar/Kafka）
    volumes: # 数据卷挂载
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus # 持久化 Milvus 本地数据（RocksMQ 消息日志等）
      - ${DOCKER_VOLUME_DIRECTORY:-.}/configs/milvus.yaml:/var/lib/milvus/configs/milvus.yaml # S3 对象存储（RustFS）连接配置
    healthcheck: # Milvus 健康检查配置
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"] # 访问 9091 管理端口的 healthz 接口判断可用性
      interval: 30s # 检查频率 30 秒
      start_period: 90s # 启动宽限期：给 Milvus 90 秒的初始化时间，期间的检查失败不作数（Milvus 启动加载项较多）
      timeout: 20s # 超时 20 秒
      retries: 3 # 容错 3 次
    ports: # 向外部宿主机暴露端口
      - "19530:19530" # 核心端口：Python 代码（如 PyMilvus 库）通过该端口使用 gRPC/RESTful 协议执行增删改查
      - "9091:9091" # 管理端口：用于暴露 Prometheus 监控指标 (metrics) 以及健康状态
    restart: always  # 总是自动重启
    depends_on: # 启动顺序依赖控制
      - "etcd" # 等待 etcd 容器启动后再启动本容器
      - "rustfs" # 等待 rustfs 容器启动后再启动本容器
      
  attu: # 定义 Attu 服务，这是 Milvus 官方提供的、专给人类看的直观图形化管理界面
    container_name: attu # 固定容器名称
    image: zilliz/attu:v2.5.10 # 使用与 Milvus 2.5 版本配套的 Attu 镜像（版本兼容非常重要）
    environment: # Attu 的运行参数
      - MILVUS_URL=standalone:19530 # 设置 Attu 要接管的 Milvus 数据库的内部访问地址
      - ATTU_LOG_LEVEL=info # 设置后端控制台的日志打印级别为 info
      - SERVER_NAME=auto_gui # 定义该 GUI 服务的内部标识名
      - SERVER_PORT=7000 # 设置 Attu Web 服务在容器内监听的端口为 7000
    ports: # 映射给前端浏览器使用
      - "7000:7000" # 映射到宿主机 7000，开发时浏览器直接访问 http://localhost:7000 即可进入管理面板
    volumes: # 数据挂载
      # 映射您指定的 TLS 目录
      - /root/milvus:/app/tls # 若后续为 Milvus 配置了安全证书（TLS/SSL），Attu 将从这里读取证书建立安全连接
    restart: always  # 总是自动重启
    depends_on: # 依赖控制
      - standalone    # 必须等 Milvus (standalone) 启动完毕后，UI 界面才跟着启动
      
  neo4j: # 定义 Neo4j 图数据库服务，用于存储知识图谱中的实体节点和边（关系）
    image: neo4j:2026.01.3 # 指定 Neo4j 镜像
    volumes: # 为保障图谱心血数据不丢，必须严格映射四大核心目录
        - /root/neo4j/logs:/logs # 挂载运行日志，Cypher 语句报错或内存溢出时需查看此目录
        - /root/neo4j/config:/config # 挂载配置目录，方便后续修改内存分配 (neo4j.conf)
        - /root/neo4j/data:/data # 图谱数据的物理存储目录，【绝对不能丢】的重中之重
        - /root/neo4j/plugins:/plugins # 存放额外插件包，如需图计算算法 (GDS) 或 APOC 库，把 .jar 丢进这里即可
    environment: # 初始环境配置
        - NEO4J_AUTH=neo4j/hzk123456 # 初始化数据库超级管理员账号（neo4j）及强制密码（hzk123456）
    ports: # 暴露图数据库端口
      - "7474:7474" # Browser 端口：用于浏览器访问图形化控制台，用来手动敲 Cypher 测图谱关系
      - "7687:7687" # Bolt 协议端口：Python 代码 (neo4j-driver) 连接数据库执行自动化抽取和查询的专用高速通道
    restart: always # 总是自动重启

  mongo: # 定义 MongoDB 文档数据库服务，用于存放知识库文档、切片等非结构化业务数据
    container_name: mongo # 固定容器名称，方便用 docker 命令直接管理
    image: mongo:7.0 # 指定 MongoDB 官方镜像
    volumes: # 数据卷持久化挂载
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo:/data/db # 将宿主机目录映射给 MongoDB 存放实际数据，删容器不丢数据
    environment: # 初始环境配置；本地开发不带鉴权（如需鉴权加 MONGO_INITDB_ROOT_USERNAME/PASSWORD 并同步改 .env 的 MONGO_URL）
      - MONGO_INITDB_DATABASE=kb001 # 首次启动时自动创建 .env 中 MONGO_DB_NAME 指定的数据库
    ports: # 暴露端口
      - "27017:27017" # MongoDB 默认端口，.env 的 MONGO_URL=mongodb://localhost:27017 通过它连接
    restart: always # 总是自动重启

networks: # 自定义容器内部的虚拟网络
  default: # 覆盖默认网络行为
    name: milvus # 统一命名为 "milvus"。在此网络下，各个容器可直接使用对方的服务名（如 "rustfs", "etcd"）互通有无，无需知道对方的真实内网 IP