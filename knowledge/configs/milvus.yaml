# ============================================================
# Milvus S3 对象存储配置（替代 compose 中的 MINIO_* 环境变量）
#
# 注意：键名 minioAddress / minioAccessKeyID 等是 Milvus 内部
#       配置系统的固定名称，不可更改（源码硬编码）。
#       值全部指向 RustFS，与 .env 中 RUSTFS_ACCESS_KEY 一致。
# ============================================================

common:
  storage:
    # S3 端点（Docker 内部 DNS，指向 rustfs 容器）
    minioAddress: "rustfs:9000"
    # 根凭据（必须与 rustfs 容器的 RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY 一致）
    minioAccessKeyID: "rustfs"
    minioSecretAccessKey: "rustfs"
    # 非 AWS 环境，关闭 IAM 签名认证
    useIAM: false
