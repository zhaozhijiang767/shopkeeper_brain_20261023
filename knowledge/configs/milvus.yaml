# ============================================================
# Milvus 对象存储配置（覆盖官方默认，挂载为 user.yaml）
#
# 键名以 Milvus v2.5.5 的 minio: 段为准（源码/默认 milvus.yaml 已核对）。
# 地址/凭据全部指向 rustfs 容器，与 compose 里 RUSTFS_ACCESS_KEY/SECRET_KEY 一致。
# ============================================================

minio:
  # S3 端点（Docker 内部 DNS，指向 rustfs 容器）；address 与 port 分开写
  address: rustfs
  port: 9000
  # 根凭据（必须与 rustfs 容器的 RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY 一致）
  accessKeyID: rustfs
  secretAccessKey: rustfs
  # 非 AWS 环境，关闭 SSL 与 IAM 签名认证
  useSSL: false
  useIAM: false
  # Milvus 自己的数据桶（首次启动自动创建，合法桶名，勿用下划线）
  bucketName: milvus-bucket
  rootPath: files
